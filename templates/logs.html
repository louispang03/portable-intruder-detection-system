{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Notification Logs</h2>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Timestamp</th>
                <th>Title</th>
                <th>Message</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.timestamp }}</td>
                <td>{{ log.title }}</td>
                <td>{{ log.message }}</td>
                <td>
                    {% if log.image %}
                    <a href="{{ url_for('uploaded_file', filename=log.image) }}" target="_blank">View Image</a>
                    {% else %}
                    -
                    {% endif %}
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">No logs available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
